# =========================
# Server
# =========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# =========================
# PostgreSQL
# Local default: localhost
# Docker default: override DB_HOST=postgres in docker-compose
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:medverse_db}
spring.datasource.username=${POSTGRES_USER:medverse_user}
spring.datasource.password=${POSTGRES_PASSWORD:medverse_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA & Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Flyway
# =========================
spring.flyway.enabled=true

# =========================
# Redis
# Local default: localhost
# Docker default: override REDIS_HOST=redis in docker-compose
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# JWT
# These keys are read directly by JwtService via @Value("${JWT_SECRET}")
# =========================
JWT_SECRET=${JWT_SECRET}
JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:3600000}
JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =========================
# Default Admin
# =========================
DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:admin@medverse.vn}
DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:Admin@123456}

# =========================
# Frontend
# =========================
FRONTEND_BASE_URL=${FRONTEND_BASE_URL:http://localhost:3000}

# =========================
# AI Service - dùng ở task sau
# =========================
medverse.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
medverse.ai.timeout-ms=${AI_TIMEOUT_MS:5000}

# =========================
# Email Sender Configuration
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Logging
# =========================
logging.level.org.springframework.security=DEBUG