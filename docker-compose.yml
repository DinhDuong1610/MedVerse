version: '3.8'

services:
  app:
    build: .
    container_name: medverse_backend_app
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS}

      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}

      - AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS}

      - DEMO_DATA_ENABLED=${DEMO_DATA_ENABLED}

  postgres:
    image: postgres:15-alpine
    container_name: medverse_postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medverse_redis_cache
    ports:
      - "${REDIS_PORT}:6379"
  # frontend:
  #   build:
  #     context: ./medverse-frontend
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./medverse-frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8080/api
  #     - WATCHPACK_POLLING=true
